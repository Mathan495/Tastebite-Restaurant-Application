{% extends 'base.html' %} {% block content %}

<section class="py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow border-0">
          <div class="card-body p-5">
            <h2 class="fw-bold mb-4">Customer Details</h2>
            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label>Name *</label>
                <input
                  type="text"
                  name="full_name"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label>Phone Number *</label>

                <input type="text" name="phone" class="form-control" required />
              </div>

              <div class="mb-3">
                <label>Email</label>

                <input type="email" name="email" class="form-control" />
              </div>

              <div class="mb-3">
                <label>Address *</label>

                <textarea
                  name="address"
                  class="form-control"
                  rows="3"
                  required
                ></textarea>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <label>City</label>

                  <input type="text" name="city" class="form-control" />
                </div>

                <div class="col-md-6">
                  <label>Pincode</label>

                  <input type="text" name="pincode" class="form-control" />
                </div>
              </div>

              <br />

              <div class="mb-3">
                <label>Special Instructions</label>

                <textarea
                  name="instruction"
                  rows="3"
                  class="form-control"
                ></textarea>
              </div>

              <h5 class="mt-4">Payment Method</h5>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="payment"
                  value="Cash"
                  checked
                />

                <label class="form-check-label"> Cash on Delivery </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="payment"
                  value="UPI"
                />

                <label class="form-check-label"> UPI </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="payment"
                  value="Card"
                />

                <label class="form-check-label"> Card </label>
              </div>

              <hr />

              <h5>Delivery Type</h5>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="delivery"
                  value="Dine In"
                  checked
                />

                <label>Dine In</label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="delivery"
                  value="Take Away"
                />

                <label>Take Away</label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="delivery"
                  value="Home Delivery"
                />

                <label>Home Delivery</label>
              </div>

              <br />

              <a href="{% url 'place_order' %}" class="btn btn-success w-100">
                Place Order
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
